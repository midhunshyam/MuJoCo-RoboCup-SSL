[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mujoco-robocup-ssl"
version = "0.1.0"
description = "RoboCup Small Size League (Division B) field, ball and robot in MuJoCo, with a Gymnasium go-to-ball task."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["robocup", "ssl", "mujoco", "gymnasium", "reinforcement-learning", "robotics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mujoco>=3.2",
    "gymnasium>=1.0",
    "numpy>=1.23",
]

[project.optional-dependencies]
train = [
    "stable-baselines3>=2.7",
    "torch>=2.0",
    "matplotlib>=3.7",
    "pillow>=10.1",
]
dev = [
    "pytest>=7",
    "ruff>=0.6,<0.18",
]

[project.urls]
Repository = "https://github.com/midhunshyam/MuJoCo-RoboCup-SSL"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "SIM"]
